<header>
  {{ partial "logo.html" . }}
  <hgroup>
    <h1><a href="{{ .Site.BaseURL }}">{{ .Site.Title }}</a></h1>
    {{ with .Site.Menus.main }}
    <nav aria-label="Main navigation">
      <ul>
        {{ range .ByWeight }}
        <li><a href="{{ .URL | relURL }}">{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>
    {{ end }}
  </hgroup>
</header>
